openapi: 3.1.0
info:
  title: Super Transcriber API
  version: 1.0.0
  description: Private MP3/M4A uploads, durable asynchronous transcription, TXT/JSON/SRT/VTT downloads, measured usage,
    signed callbacks, customer API keys, and optional Stripe subscriptions.
servers:
  - url: https://pn72sppog0.execute-api.us-east-1.amazonaws.com
security:
  - ApiKeyAuth: []
paths:
  /:
    get:
      security: []
      summary: API root status
      responses:
        "200":
          description: Service health
      operationId: get
  /health:
    get:
      security: []
      summary: Health check
      responses:
        "200":
          description: Service health
      operationId: getHealth
  /v1/api-keys:
    post:
      security:
        - ApiKeyAuth: []
        - AdminTokenAuth: []
        - AdminBearerAuth: []
      summary: Create a scoped customer key, or provision an account as admin
      responses:
        "201":
          description: Created API key. Plaintext key is returned once.
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Permission or billing restriction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Owned resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Job or receipt conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: Transcript retention expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate or usage limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Optional feature is not configured or implemented
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                keyName:
                  type: string
                customerId:
                  type: string
                  description: Admin only
                scopes:
                  type: array
                  items:
                    type: string
                    enum:
                      - uploads:write
                      - transcriptions:write
                      - transcriptions:read
                      - transcriptions:delete
                      - keys:manage
                      - billing:read
                      - billing:write
                      - webhooks:manage
      operationId: postV1ApiKeys
    get:
      summary: List customer API-key metadata; hashes and plaintext are excluded
      parameters: &a1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Keys and nextCursor
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Permission or billing restriction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Owned resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Job or receipt conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: Transcript retention expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate or usage limit exceeded
          content:
            application/json:
              schema:
