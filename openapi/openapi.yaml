        "500":
          description: Internal failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Optional feature is not configured or implemented
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: getV1ApiKeys
