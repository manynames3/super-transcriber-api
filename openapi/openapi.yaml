components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
    AdminTokenAuth:
      type: apiKey
      in: header
      name: x-admin-token
    AdminBearerAuth:
      type: http
      scheme: bearer
    StripeSignatureAuth:
      type: apiKey
      in: header
      name: stripe-signature
  parameters:
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    JobStatus:
      type: string
      enum:
        - PENDING_UPLOAD
        - QUEUED
        - STARTING
        - IN_PROGRESS
        - COMPLETED
        - FAILED
    PresignUploadRequest:
      type: object
      required:
        - fileName
        - contentType
        - fileSizeBytes
      properties:
        fileName:
          type: string
          examples:
            - meeting.mp3
        contentType:
          type: string
          examples:
            - audio/mpeg
        fileSizeBytes:
          type: integer
          minimum: 1
          maximum: 209715200
    PresignUploadResponse:
      type: object
      required:
        - uploadUrl
        - uploadMethod
        - uploadHeaders
        - jobId
        - s3Key
        - expiresInSeconds
      properties:
        uploadUrl:
          type: string
        uploadMethod:
          type: string
          const: PUT
        uploadHeaders:
          type: object
          additionalProperties:
            type: string
        jobId:
          type: string
          format: uuid
        s3Key:
          type: string
        expiresInSeconds:
          type: integer
        startRequest:
          $ref: "#/components/schemas/CreateTranscriptionRequest"
    CreateTranscriptionRequest:
      type: object
      properties:
        s3Key:
          type: string
        sourceUrl:
          type: string
        fileName:
          type: string
        durationSeconds:
          type: integer
          minimum: 1
          description: Optional advisory hint; the worker measures actual audio duration.
        speakerCount:
          type: integer
          minimum: 1
          maximum: 10
        languageCode:
          type: string
          examples:
            - en-US
          description: Amazon Transcribe supported language code; defaults to deployment configuration.
      oneOf:
        - required:
            - s3Key
        - required:
            - sourceUrl
    CreateTranscriptionResponse:
      type: object
      required:
        - jobId
        - status
        - pollUrl
      properties:
        jobId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/JobStatus"
        pollUrl:
          type: string
    TranscriptionJob:
      type: object
      required:
        - jobId
        - status
        - fileName
        - wordCount
        - createdAt
        - updatedAt
      properties:
        jobId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/JobStatus"
        fileName:
          type: string
        durationSeconds:
          type:
            - number
            - "null"
        wordCount:
          type: integer
        failureReason:
          type:
            - string
            - "null"
        transcriptText:
          type: string
        transcriptJsonUrl:
          type: string
        enrichmentJsonUrl:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        languageCode:
          type: string
    ConfigureWebhookRequest:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
            enum:
              - transcription.completed
              - transcription.failed
        enabled:
          type: boolean
    CreateCheckoutRequest:
      type: object
      required:
        - email
        - planId
      properties:
        email:
          type: string
          format: email
        planId:
          type: string
          examples:
            - starter
        successUrl:
          type: string
          format: uri
          description: Optional; defaults to the configured hosted receipt page.
        cancelUrl:
          type: string
          format: uri
          description: Optional. Defaults to the API Gateway health URL.
    ClaimCheckoutRequest:
      type: object
      required:
        - checkoutSessionId
        - claimToken
      properties:
        checkoutSessionId:
          type: string
        claimToken:
          type: string
        recover:
          type: boolean
          default: false
    BillingPortalRequest:
      type: object
      required:
        - returnUrl
      properties:
        returnUrl:
          type: string
          format: uri
    Error:
      type: object
      required:
        - success
        - error
        - code
      properties:
        success:
          const: false
        error:
          type: string
        code:
          type: string
    NormalizedTranscript:
      type: object
      required:
        - jobId
        - transcriptText
        - wordCount
        - words
        - segments
      properties:
        jobId:
          type: string
          format: uuid
        transcriptText:
          type: string
        wordCount:
          type: integer
        durationSeconds:
          type:
            - number
            - "null"
        languageCode:
          type: string
        segments:
          type: array
          items:
            type: object
            required:
              - text
              - start
              - end
              - speaker
            properties:
              text:
                type: string
              start:
                type: number
                minimum: 0
              end:
                type: number
                minimum: 0
              speaker:
                type:
                  - string
                  - "null"
        words:
          type: array
          items:
            type: object
            required:
              - text
              - start
              - end
              - speaker
              - confidence
            properties:
              text:
                type: string
              start:
                type: number
              end:
                type: number
              speaker:
                type:
                  - string
                  - "null"
              confidence:
                type:
                  - number
                  - "null"
