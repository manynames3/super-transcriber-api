name: Deploy AWS

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: lambda/package-lock.json

      - name: Install Lambda dependencies
        working-directory: lambda
        run: npm ci

      - name: Verify Lambda code
        working-directory: lambda
        run: npm run build && npm test

      - name: Bundle Lambdas
        working-directory: lambda
        run: npm run bundle

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/github-actions-super-transcriber-api
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform init
        working-directory: terraform
        run: terraform init -backend-config=backend.hcl

      - name: Terraform plan
        working-directory: terraform
        run: terraform plan -out=tfplan

      - name: Block destructive plans
        working-directory: terraform
        run: terraform show -json tfplan | node ../scripts/check-plan.mjs

      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan
