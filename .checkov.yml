framework:
  - terraform
quiet: true
compact: true
skip-check:
  # Authentication is enforced in Lambda with hashed API keys; HTTP API routes do not use JWT/IAM authorizers.
  - CKV_AWS_309
  # PITR is an explicit optional variable; the default deployment minimizes retained data and idle spend.
  - CKV_AWS_28
  # AWS-managed encryption is enabled; customer-managed keys would add fixed monthly charges.
  - CKV_AWS_119
  - CKV_AWS_173
  - CKV_AWS_158
  - CKV_AWS_149
  - CKV_AWS_145
  # No VPC/NAT; request/event logs provide the default observability surface.
  - CKV_AWS_117
  - CKV_AWS_50
  # Synchronous APIs return errors; async workers have SQS redrive and completion has a failure destination.
  - CKV_AWS_116
  # Artifacts are built/tested in CI and deployed through scoped IAM; AWS Signer is not configured.
  - CKV_AWS_272
  # Fourteen-day logs and lifecycle-expired media are deliberate privacy defaults.
  - CKV_AWS_338
  - CKV_AWS_18
  # Media is unversioned for permanent deletion and stays in the customer's selected AWS region.
  - CKV_AWS_21
  - CKV_AWS_144
  # Explicit API submission and Transcribe events drive processing, not S3 object notifications.
  - CKV2_AWS_62
  # External admin/Stripe credentials are rotated by their owner; no automatic rotation Lambda is deployed.
  - CKV2_AWS_57
